<section class="hero-section" id="about">
  <div class="container hero-grid">
    <div>
      <h1>{{ site.data.profile.name }}</h1>
      <p class="hero-role">{{ site.data.profile.role }}</p>
      <p class="hero-institution">{{ site.data.profile.institution }} · {{ site.data.profile.location }}</p>
      <p class="intro">{{ site.data.profile.intro }}</p>
    </div>
    <aside class="profile-card">
      <img
        src="{{ site.data.profile.profile_image | relative_url }}"
        alt="{{ site.data.profile.name }}"
        class="profile-photo"
      >
      <div class="profile-links">
        <a href="{{ site.data.profile.github }}" target="_blank"
           rel="noopener" aria-label="GitHub" title="GitHub">
          <i class="fa-brands fa-github"></i>
        </a>
        <a href="{{ site.data.profile.linkedin }}" target="_blank"
           rel="noopener" aria-label="LinkedIn" title="LinkedIn">
          <i class="fa-brands fa-linkedin"></i>
        </a>
        {% if site.data.profile.show_cv_button %}
        <a href="{{ site.data.profile.cv_file | relative_url }}"
           target="_blank" aria-label="CV" title="CV">
          <i class="fa-solid fa-file-pdf"></i>
        </a>
        {% endif %}
        <a href="{{ site.data.profile.google_scholar }}" target="_blank"
           rel="noopener" aria-label="Google Scholar" title="Google Scholar">
          <i class="fa-solid fa-graduation-cap"></i>
        </a>
        <a href="mailto:{{ site.data.profile.email }}"
           aria-label="Email" title="Email">
          <i class="fa-solid fa-envelope"></i>
        </a>
      </div>
    </aside>
  </div>
</section>
