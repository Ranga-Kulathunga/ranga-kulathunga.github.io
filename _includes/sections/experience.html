<section class="section" id="experience">
  <div class="container">
    <div class="section-heading"><h2>Experience</h2></div>
    {% for item in site.data.experience %}
      <article class="timeline-item">
        <div class="timeline-meta"><span>{{ item.period }}</span></div>
        <div class="timeline-content">
          <h3>{{ item.role }}</h3>
          <p class="muted"><a href="{{ item.url }}" target="_blank" rel="noopener noreferrer">
            {{ item.organization }}
          </a> · {{ item.location }}</p>
        </div>
      </article>
    {% endfor %}
  </div>
</section>
